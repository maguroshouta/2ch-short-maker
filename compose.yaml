services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - 2ch-short-maker-postgres-data:/var/lib/postgresql/data
  minio:
    image: minio/minio
    environment:
      MINIO_ACCESS_KEY: minio_access_key
      MINIO_SECRET_KEY: minio_secret_key
    ports:
      - "9000:9000"
    command: server --address ":9000" /data
    volumes:
      - 2ch-short-maker-minio-data:/data

volumes:
  2ch-short-maker-postgres-data:
  2ch-short-maker-minio-data:
